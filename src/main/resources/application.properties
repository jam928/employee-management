#MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee-management
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}
spring.jpa.show-sql=true
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate

# Spring boot actuator properties
management.endpoints.web.exposure.include=httpexchanges,health,metrics
management.endpoint.health.show-details=always

# Flyway migrations
spring.flyway.locations=classpath:db/migration
# Databases created before Flyway was added (by Hibernate's ddl-auto) are baselined at V1 instead of failing
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/employee/**

# MinIO image storage
# endpoint: where this app reaches MinIO. public-url: the base URL browsers use to load the images.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
minio.bucket=${MINIO_BUCKET:employee-images}

# Image uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
